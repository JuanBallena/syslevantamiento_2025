<div class="m-form-section" data-id="{{id}}" data-tipo="natural">
  <div class="a-close-button btn-eliminar">x</div>

  <div class="m-form-section__title">Datos generales</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-blue">25</span>Estado Civil</label>
      <select name="estado_civil" class="a-input-text input-estado-civil">
        {{estadoCivilOpciones}}
      </select>
    </div>
    <div>
      <label><span class="box-label-red">26</span>Tipo Doc. Identidad</label>
      <select name="tipo_documento" class="a-input-text input-tipo-doc">
        {{tipoDocumentoOpciones}}
      </select>
    </div>
    <div>
      <label><span class="box-label-red">27</span>N° Documento</label>
      <input
        type="text"
        class="a-input-text input-num-doc"
        name="numero_documento"
        placeholder="Escriba"
      />
      <!-- <div>
        <label class="custom-checkbox">
          <input name="chk-sin-doc" type="checkbox" name="sin_documento" />
          <span class="checkmark"></span>
          <span class="label-text">Sin Nro. Doc.</span>
        </label>
      </div> -->
    </div>
    <div>
      <label><span class="box-label-red">28</span>Nombres</label>
      <input type="text" class="a-input-text input-nombres" name="nombres" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-red">29</span>Apellido Paterno</label>
      <input
        type="text"
        class="a-input-text input-apellido-paterno"
        name="apellido_paterno"
        placeholder="Escriba"
      />
    </div>
    <div>
      <label><span class="box-label-red">30</span>Apellido Materno</label>
      <input
        type="text"
        class="a-input-text input-apellido-materno"
        name="apellido_materno"
        placeholder="Escriba"
      />
    </div>
  </div>
</div>
