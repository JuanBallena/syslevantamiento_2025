<div class="m-form-section" id="inscripcion-predio">
  <div class="m-form-section__title">Inscripción del Predio Catastral</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-blue">79</span>Tipo de partida</label>
      <select class="a-input-text" name="tipo_partida"></select>
    </div>
    <div>
      <label><span class="box-label-blue">80</span>Número</label>
      <input class="a-input-text" type="text" name="nume_partida" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">81</span>Fojas</label>
      <input class="a-input-text" type="text" name="fojas" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">82</span>Asiento</label>
      <input class="a-input-text" type="text" name="asiento" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">83</span>Fecha inscrip Predio</label>
      <input class="a-input-text" type="date" name="fecha_inscripcion" />
    </div>
    <div>
      <label><span class="box-label-blue">84</span>Decla. Fábrica</label>
      <select class="a-input-text" name="codi_decla_fabrica"></select>
    </div>
    <div>
      <label><span class="box-label-blue">85</span>Asiento fábrica</label>
      <input class="a-input-text" type="text" name="asie_fabrica" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">86</span>Fecha inscrip fábrica</label>
      <input class="a-input-text" type="date" name="fecha_fabrica" />
    </div>
  </div>
</div>
