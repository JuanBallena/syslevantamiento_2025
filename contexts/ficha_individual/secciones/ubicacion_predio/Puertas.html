<div class="m-form-section" data-puerta="{{puertaId}}" data-tipo="puerta">
  <div class="a-close-button is-danger-color btn-eliminar-puerta">x</div>

  <div class="grid grid-cols-1 gap-1">
    <div>
      <label><span class="box-label-blue">10</span>Tipo</label>
      <select class="a-input-text puerta-tipo" name="tipo_puerta" select-tipo-puerta></select>
    </div>

    <div>
      <label><span class="box-label-blue">11</span>Nro. Municipal</label>
      <input
        placeholder="Escriba"
        class="a-input-text puerta-numero"
        type="text"
        name="nume_muni"
      />
    </div>

    <div>
      <label><span class="box-label-blue">12</span>Cond. nro.</label>
      <select class="a-input-text puerta-estado" name="cond_nume" select-cond-nume></select>
    </div>

    <div>
      <label><span class="box-label-blue">13</span>Nro. Certif. de numeración</label>
      <input
        placeholder="Escriba"
        class="a-input-text puerta-numero"
        type="text"
        name="nume_certificacion"
      />
    </div>
  </div>
</div>
