<div class="m-form-section" id="descripcion-predio">
  <div class="m-form-section__title">Descripción del Predio</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-red">40</span>Clasificación del predio</label>
      <select class="a-input-text" name="clasificacion" data-validate="required"></select>
    </div>
    <div>
      <label><span class="box-label-red">41</span>Predio Catastral En</label>
      <select class="a-input-text" name="cond_en" data-validate="required"></select>
    </div>
    <div>
      <label><span class="box-label-red">42</span>Código de uso</label>
      <input
        class="a-input-text"
        type="text"
        placeholder="Escriba"
        name="codi_uso_codi_desc"
        data-validate="required"
      />
      <input type="hidden" name="codi_uso" />
    </div>
    <div>
      <label><span class="box-label-red">43</span>Uso Predio Catastral</label>
      <div>
        <input type="text" name="desc_uso" class="a-input-text" placeholder="Escriba" disabled />
        <!-- <input type="hidden" name="codi_uso" /> -->
      </div>
    </div>
    <!-- <div>
      <label><span class="box-label-blue">58</span>Estructuración</label>
      <input class="a-input-text" type="number" placeholder="Escriba" name="estructuracion" />
    </div> -->
    <div>
      <label><span class="box-label-blue">44</span>Zonificación</label>
      <input class="a-input-text" type="text" placeholder="Escriba" name="zonificacion" />
    </div>
    <div>
      <label><span class="box-label-blue">45</span>Área de terreno adquirida</label>
      <input class="a-input-text" type="number" placeholder="Escriba" name="area_titulo" />
    </div>
    <div>
      <label><span class="box-label-blue">46</span>Área de terreno verificada</label>
      <input class="a-input-text" type="number" placeholder="Escriba" name="area_verificada" />
    </div>
  </div>

  <div class="w-7-12">
    <table class="table-default mt-8" id="tabla-linderos">
      <thead>
        <tr>
          <th>LINDEROS DE LOTE (ML)</th>
          <th><span class="box-label-blue">47</span>MEDIDA EN CAMPO</th>
          <th><span class="box-label-blue">48</span>COLINDANCIAS EN CAMPO</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>FRENTE</td>
          <td>
            <input type="number" class="a-input-text" name="fren_campo" placeholder="Escriba" />
          </td>
          <td>
            <input
              type="number"
              class="a-input-text"
              name="fren_colinda_campo"
              placeholder="Escriba"
            />
          </td>
        </tr>
        <tr>
          <td>DERECHA</td>
          <td>
            <input type="number" class="a-input-text" name="dere_campo" placeholder="Escriba" />
          </td>
          <td>
            <input
              type="number"
              class="a-input-text"
              name="dere_colinda_campo"
              placeholder="Escriba"
            />
          </td>
        </tr>
        <tr>
          <td>IZQUIERDA</td>
          <td>
            <input type="number" class="a-input-text" name="izqu_campo" placeholder="Escriba" />
          </td>
          <td>
            <input
              type="number"
              class="a-input-text"
              name="izqu_colinda_campo"
              placeholder="Escriba"
            />
          </td>
        </tr>
        <tr>
          <td>FONDO</td>
          <td>
            <input type="number" class="a-input-text" name="fond_campo" placeholder="Escriba" />
          </td>
          <td>
            <input
              type="number"
              class="a-input-text"
              name="fond_colinda_campo"
              placeholder="Escriba"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
