        <th><span class="box-label-blue">57</span></th>
        <th><span class="box-label-blue">58</span></th>
        <th><span class="box-label-blue">59</span></th>
        <th><span class="box-label-blue">60</span></th>
        <th><span class="box-label-blue">61</span></th>

        <th>ECC</th>

        <th>Techos</th>

        <th>Baños</th>

          <option value="5">5 piso</option>

          <option value="11">11 piso</option>
          <option value="12">12 piso</option>

      </td>
      <td>
        <select class="a-input-text" name="mep"></select>
      </td>
      <td>
        <select class="a-input-text" name="ecs"></select>

      <td>

      <td>
        <input class="a-input-text" name="inst_elect_sanita" type="text" placeholder="Escriba" />
      </td>
      <td>
        <input class="a-input-text" name="area_verificada" type="text" placeholder="Escriba" />
      </td>
      <td><select class="a-input-text" name="uca"></select></td>
