<div class="m-form-section" id="informacion-complementaria">
  <div class="m-form-section__title">Información Complementaria</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-blue">114</span>Condición del declarante</label>
      <select
        class="a-input-text"
        name="condicion_declarante"
        id="select-condiciones-declarantes"
      ></select>
    </div>
    <div>
      <label><span class="box-label-red">116</span>Estado llenado de la Ficha</label>
      <select class="a-input-text" name="estado_ficha" id="select-estados-fichas"></select>
    </div>
    <!-- <div>
                <label>Cantidad de Medidores</label>
                <input class="a-input-text" type="number" name="cantidad_medidores" value="1" />
              </div> -->
    <div>
      <label><span class="box-label-blue">119</span>Mantenimiento</label>
      <select class="a-input-text" name="mantenimiento" id="select-mantenimientos"></select>
    </div>
    <div>
      <label><span class="box-label-blue">117</span>Nro. Habitantes</label>
      <input
        class="a-input-text"
        type="text"
        placeholder="Escriba"
        name="numero_habitantes"
        value=""
      />
    </div>
    <div>
      <label><span class="box-label-blue">118</span>Nro. Familias</label>
      <input
        class="a-input-text"
        type="number"
        placeholder="Escriba"
        name="numero_familias"
        value=""
      />
    </div>
  </div>

  <p class="my-4 text-6 text-600">
    <span class="box-label-blue">115</span>Identificación de los litigantes
  </p>

  <button class="a-btn btn-primary mb-6" type="button" onclick="agregarFilaTablaLitigantes()">
    Añadir fila
  </button>

  <table class="table-default" id="tabla-litigantes" border="1">
    <thead>
      <tr>
        <th class="w-20-per">N° documento</th>
        <th class="w-40-per">Apellidos y nombres</th>
        <th class="w-20-per">Código del contribuyente</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <template id="filaTablaLitigantes">
    <tr>
      <td>
        <input
          class="w-11-12 a-input-text"
          name="numero_documento"
          type="text"
          placeholder="Escriba"
        />
      </td>
      <td>
        <input
          class="w-11-12 a-input-text"
          name="nombres_apellidos"
          type="text"
          placeholder="Escriba"
        />
      </td>
      <td>
        <input
          class="w-11-12 a-input-text"
          name="codigo_contribuyente"
          type="text"
          placeholder="Escriba"
        />
      </td>
    </tr>
  </template>
</div>
