<div class="m-form-section" id="evaluacion-predio">
  <div class="m-form-section__title">Evaluación del Predio</div>

  <div class="mb-8">
    <p class="text-5 text-600 mb-4">
      <span class="box-label-blue">112</span>Evaluación del Predio Catastral
    </p>

    <div class="flex gap-x-4">
      <label class="custom-radio">
        <input type="radio" name="tipo_predio[]" />
        <span class="checkmark"></span>
        Predio Catastral Omiso
      </label>

      <label class="custom-radio">
        <input type="radio" name="tipo_predio[]" />
        <span class="checkmark"></span>
        Predio Catastral Subvaluado
      </label>

      <label class="custom-radio">
        <input type="radio" name="tipo_predio[]" />
        <span class="checkmark"></span>
        Predio Catastral Sobrevaluado
      </label>

      <label class="custom-radio">
        <input type="radio" name="tipo_predio[]" />
        <span class="checkmark"></span>
        Predio Catastral Conforme
      </label>
    </div>
  </div>

  <p class="text-5 text-600 mt-8 mb-4">
    <span class="box-label-blue">113</span>Área de terreno invadida (M2)
  </p>
  <div class="grid grid-cols-5 gap-1">
    <div>
      <label>En lote colindante</label>
      <input class="a-input-text" type="number" name="en_colindante" placeholder="Escriba" />
    </div>
    <div>
      <label>En área pública</label>
      <input class="a-input-text" type="number" name="en_area_publica" placeholder="Escriba" />
    </div>
    <div>
      <label>En jardín de aislamiento</label>
      <input
        class="a-input-text"
        type="number"
        name="en_jardin_aislamiento"
        placeholder="Escriba"
      />
    </div>
    <div>
      <label>En área intangible</label>
      <input class="a-input-text" type="number" name="en_area_intangible" placeholder="Escriba" />
    </div>
  </div>
</div>
