<!-- DATOS DEL DECLARANTE -->
<div class="m-form-section" id="datos-declarante">
  <div class="m-form-section__title">
    <span class="box-label-blue">120</span>Datos del Declarante
  </div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label>DNI</label>
      <div>
        <input
          class="a-input-text"
          placeholder="Escriba"
          type="text"
          name="dni"
          data-validate="numeric"
        />
        <input type="checkbox" class="none" name="existe_declarante" />
      </div>
    </div>
    <div>
      <label>Nombres</label>
      <input class="a-input-text" type="text" name="nombres" placeholder="Escriba" />
    </div>
    <div>
      <label>Apellido Paterno</label>
      <input class="a-input-text" type="text" name="ape_paterno" placeholder="Escriba" />
    </div>
    <div>
      <label>Apellido Materno</label>
      <input class="a-input-text" type="text" name="ape_materno" placeholder="Escriba" />
    </div>
    <div>
      <label>Fecha Levantamiento</label>
      <input class="a-input-text" type="date" name="fecha_declarante" />
    </div>
  </div>
</div>
<br />

    </div>
    <div>
      <label>Apellido Paterno</label>
      <input class="a-input-text" type="text" name="ape_paterno" disabled />
    </div>
    <div>
      <label>Apellido Materno</label>

    </div>
    <div>
      <label>Fecha Levantamiento</label>
      <input class="a-input-text" type="date" name="fecha" />
    </div>
  </div>
</div>
<br />
