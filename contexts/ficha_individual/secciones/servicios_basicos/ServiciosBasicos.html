<div class="m-form-section" id="servicios-basicos">
  <div class="m-form-section__title">Servicios Básicos</div>

  <div class="grid grid-cols-5 gap-1 mb-8">
    <label class="custom-checkbox">
      <input name="luz" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text"><span class="box-label-blue">67</span>Luz</span>
    </label>

    <label class="custom-checkbox">
      <input name="agua" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text"><span class="box-label-blue">68</span>Agua</span>
    </label>

    <label class="custom-checkbox">
      <input name="telefono" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text"><span class="box-label-blue">69</span>Telefono</span>
    </label>

    <label class="custom-checkbox">
      <input name="desague" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text"><span class="box-label-blue">70</span>Desague</span>
    </label>

    <label class="custom-checkbox">
      <input name="gas" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text">Gas Natural</span>
    </label>

    <label class="custom-checkbox">
      <input name="internet" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text">Internet</span>
    </label>

    <label class="custom-checkbox">
      <input name="cable" type="checkbox" />
      <span class="checkmark"></span>
      <span class="label-text">TV por cable o cable satelital</span>
    </label>
  </div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-blue">71</span>Nro. Suministro Luz</label>
      <input class="a-input-text" type="text" name="nume_sum_luz" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">72</span>Nro. Contrato Agua</label>
      <input class="a-input-text" type="text" name="nume_contrato_agua" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">73</span>Nro. Telefono</label>
      <input class="a-input-text" type="text" name="nume_telefono" placeholder="Escriba" />
    </div>
  </div>
</div>
