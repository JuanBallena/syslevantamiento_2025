<div class="m-form-section" id="documentos">
  <div class="m-form-section__title">Documentos</div>

  <button class="a-btn btn-primary mb-6" type="button" id="agregar-fila-documento">Añadir</button>

  <table class="table-default text-2 table-uniform" id="tabla-documentos" border="1">
    <thead>
      <tr>
        <th><span class="box-label-blue">75</span>Tipo de documento</th>
        <th><span class="box-label-blue">76</span>N° de documento</th>
        <th><span class="box-label-blue">77</span>Fecha</th>
        <th><span class="box-label-blue">78</span>Area autorizada</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <template id="filaTemplateDocumento">
    <tr>
      <td>
        <select class="a-input-text" name="tipo_doc" placeholder="Escriba"></select>
      </td>
      <td>
        <input class="a-input-text" name="nume_doc" placeholder="Escriba" type="text" />
      </td>
      <td>
        <input class="a-input-text" name="fecha_doc" type="date" />
      </td>
      <td>
        <input
          class="a-input-text"
          type="number"
          step="0.01"
          name="area_autorizada"
          data-validate="decimals:2"
          placeholder="Escriba"
        />
      </td>
      <td>
        <button class="a-btn btn-danger btn-sm eliminar-fila-documento" type="button">X</button>
      </td>
    </tr>
  </template>
