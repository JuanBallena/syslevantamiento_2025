<div class="m-form-section" id="domicilio-titular">
  <div class="m-form-section__title">Domicilio del Titular Catastral</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-red">30</span>Ubicación</label>
      <select class="a-input-text" name="tipo_ubicacion"></select>
    </div>
    <div>
      <label><span class="box-label-red">31</span>Departamento</label>
      <select class="a-input-text hidden-codi-dep" name="codi_dep"></select>
      <!-- <input type="text" class="a-input-text" name="codi_dep" placeholder="Escriba" /> -->
    </div>
    <div>
      <label><span class="box-label-red">32</span>Provincia</label>
      <select class="a-input-text" name="codi_pro"></select>
      <!-- <input type="text" class="a-input-text" name="codi_pro" placeholder="Escriba" /> -->
    </div>
    <div>
      <label><span class="box-label-red">33</span>Distrito</label>
      <select class="a-input-text" name="codi_dis"></select>
      <!-- <input type="text" class="a-input-text" name="codi_dis" placeholder="Escriba" /> -->
    </div>
    <div>
      <label><span class="box-label-blue">05</span>Código de Vía</label>
      <input type="text" class="a-input-text" name="codi_via" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">06</span>Tipo de Vía</label>
      <div>
        <input type="text" name="tipo_via" class="a-input-text" placeholder="Escriba" />
        <!-- <input type="hidden" name="id_via" /> -->
      </div>
    </div>
    <div>
      <label><span class="box-label-blue">07</span>Nombre Vía</label>
      <input type="text" class="a-input-text" placeholder="Escriba" name="nomb_via" />
      <!-- <input type="hidden" class="input-hidden-via" name="id_via" /> -->
    </div>
    <div>
      <label><span class="box-label-blue">09</span>Nro. Municipal</label>
      <input class="a-input-text" type="text" name="nume_muni" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">13</span>Nro. Interior</label>
      <input class="a-input-text" type="text" name="nume_interior" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">14</span>Código HU</label>
      <input type="text" class="a-input-text" placeholder="Escriba" name="codi_hab_urba" />
      <input type="hidden" name="id_hab_urba" />
    </div>
    <div>
      <label><span class="box-label-blue">15</span>Nombre HU</label>
      <input type="text" class="a-input-text" placeholder="Escriba" name="nomb_hab_urba" disabled />
    </div>
    <div>
      <label><span class="box-label-blue">16</span>Zona/Sector/Etapa</label>
      <input class="a-input-text disabled" type="number" placeholder="Escriba" name="sector" />
    </div>
    <div>
      <label><span class="box-label-blue">17</span>Manzana</label>
      <input type="text" class="a-input-text" name="mzna" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">18</span>Lote</label>
      <input type="text" class="a-input-text" name="lote" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">19</span>SubLote</label>
      <input type="text" class="a-input-text" name="sublote" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">34</span>Teléfono</label>
      <input type="text" class="a-input-text" name="telefono" placeholder="Escriba" />
    </div>
    <div>
      <label><span class="box-label-blue">35</span>Anexo</label>
      <input type="text" class="a-input-text" name="anexo" placeholder="Escriba" />
    </div>
    <!-- <div>
      <label><span class="box-label-blue">44</span>Fax</label>
      <input type="text" class="a-input-text" name="fax" placeholder="Escriba" />
    </div>-->
    <div>
      <label><span class="box-label-blue">36</span>Correo Electrónico</label>
      <input type="text" class="a-input-text" name="correo" placeholder="Escriba" />
    </div>
  </div>
</div>
