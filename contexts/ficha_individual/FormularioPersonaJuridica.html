<div class="m-form-section" data-id="{{id}}" data-tipo="juridica">
  <div class="a-close-button btn-eliminar">x</div>

  <div class="m-form-section__title">Datos generales</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label>Persona Jurídica</label>
      <select class="a-input-text input-tipo-pj" name="tipo_persona_juridica">
        {{personaJuridicaOpciones}}
      </select>
    </div>
    <div>
      <label>N° RUC</label>
      <input type="text" class="a-input-text input-ruc" name="ruc" placeholder="Escriba" />
    </div>
    <div class="col-span-3">
      <label>Razón Social</label>
      <input
        type="text"
        class="a-input-text input-razon-social"
        name="razon_social"
        placeholder="Escriba"
      />
    </div>
  </div>
</div>
