<div class="m-form-section" data-puerta="{{puertaId}}" data-tipo="puerta">
  <!-- <div class="m-form-section__title">Puerta {{index}}</div> -->
  <div class="a-close-button is-danger-color btn-eliminar-puerta">x</div>

  <div class="grid grid-cols-1 gap-1">
    <div>
      <label>Tipo</label>
      <select class="a-input-text puerta-tipo" name="tipo" required>
        {{puertaOpciones}}
      </select>
    </div>

    <div>
      <label>Nro. Municipal</label>
      <input
        placeholder="Escriba"
        class="a-input-text puerta-numero"
        type="text"
        name="numero_municipal"
        required
      />
    </div>

    <div>
      <label>Cond. nro.</label>
      <select class="a-input-text puerta-estado" name="cond_nume" required>
        <option selected disabled>Seleccione</option>
        <option value="01">Generado por municipalidad</option>
        <option value="02">Autogenerado por el titular Cat.</option>
        <option value="03">Generado por el técnico Cat.</option>
      </select>
    </div>
  </div>
</div>
