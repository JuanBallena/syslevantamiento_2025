<div class="m-form-section" data-via="{{viaId}}">
  <div class="a-close-button is-danger-color btn-eliminar-via">x</div>
  <div class="m-form-section__title">Vía</div>

  <div class="grid grid-cols-5 gap-1">
    <div>
      <label><span class="box-label-red">7</span>Código de Vía</label>
      <input
        type="text"
        data-autocomplete
        data-label="codi_via"
        data-value="id_via"
        data-target=".id-via"
        class="a-input-text codi-via"
      />

      <input type="hidden" class="id-via" name="id_via" />
      <!-- <section class="a-autocomplete__box none">
        <ul class="a-autocomplete__items"></ul>
      </section> -->
    </div>
    <div>
      <label><span class="box-label-blue">8</span>Tipo de Vía</label>
      <input type="text" class="a-input-text tipo-via" name="tipo_via" disabled readonly />
    </div>

    <div>
      <label><span class="box-label-blue">9</span>Nombre de Vía</label>
      <input type="text" class="a-input-text nomb-via" name="nomb_via" disabled readonly />
    </div>
  </div>

  <div class="m-form-section mt-8">
    <div class="m-form-section__title">Puertas</div>
    <div class="contenedor-puertas grid grid-cols-4 gap-1"></div>
    <div class="mt-4">
      <button type="button" class="a-btn a-btn--secondary btn-agregar-puerta">Añadir Puerta</button>
    </div>
  </div>
</div>
